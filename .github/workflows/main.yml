name: Snake Game

on:
  schedule:
    # Executa a cada 5 horas
    - cron: "0 */5 * * *"

  # Permite executar manualmente
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Gera o Snake a partir das contribuições do GitHub
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Leo22LonqueDev
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publica os arquivos na branch output
      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
